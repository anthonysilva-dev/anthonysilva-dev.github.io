<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscrição — Escola Técnica</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>Formulário de Inscrição</h1>
    <p>Preencha os dados abaixo para se inscrever.</p>
  </header>

  <main>
    <form id="formInscricao" novalidate>

      <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="campo">
          <label for="nome">Nome completo: *</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required minlength="3" />
          <span class="erro" id="erroNome"></span>
        </div>

        <div class="campo">
          <label for="email">E-mail: *</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required />
          <span class="erro" id="erroEmail"></span>
        </div>

        <div class="campo">
          <label for="telefone">Telefone: *</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(82) 99999-9999" required />
          <span class="erro" id="erroTelefone"></span>
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento: *</label>
          <input type="date" id="nascimento" name="nascimento" required />
          <span class="erro" id="erroNascimento"></span>
        </div>

      </fieldset>

      <fieldset>
        <legend>Dados Acadêmicos</legend>

        <div class="campo">
          <label for="curso">Curso: *</label>
          <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="informatica">Técnico em Informática</option>
            <option value="redes">Técnico em Redes</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="si">Sistemas de Informação</option>
          </select>
          <span class="erro" id="erroCurso"></span>
        </div>

        <div class="campo">
          <fieldset class="fieldset-interno">
            <legend>Turno: *</legend>
            <label><input type="radio" name="turno" value="manha" /> Manhã</label>
            <label><input type="radio" name="turno" value="tarde" /> Tarde</label>
            <label><input type="radio" name="turno" value="noite" /> Noite</label>
          </fieldset>
          <span class="erro" id="erroTurno"></span>
        </div>

        <div class="campo">
          <fieldset class="fieldset-interno">
            <legend>Áreas de interesse: * (mínimo 2)</legend>
            <label><input type="checkbox" name="interesses" value="web" /> Desenvolvimento Web</label>
            <label><input type="checkbox" name="interesses" value="bd" /> Banco de Dados</label>
            <label><input type="checkbox" name="interesses" value="ia" /> Inteligência Artificial</label>
            <label><input type="checkbox" name="interesses" value="redes" /> Redes</label>
            <label><input type="checkbox" name="interesses" value="seg" /> Segurança da Informação</label>
          </fieldset>
          <span class="erro" id="erroInteresses"></span>
        </div>

      </fieldset>

      <fieldset>
        <legend>Acesso</legend>

        <div class="campo">
          <label for="senha">Senha: *</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8" />
          <span class="erro" id="erroSenha"></span>
          <div id="forcaSenha" class="forca-senha"></div>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirmar senha: *</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required />
          <span class="erro" id="erroConfirmarSenha"></span>
        </div>

      </fieldset>

      <fieldset>
        <legend>Informações Adicionais</legend>

        <div class="campo">
          <label for="foto">Foto (opcional):</label>
          <input type="file" id="foto" name="foto" accept="image/jpeg,image/png" />
          <span class="erro" id="erroFoto"></span>
          <div id="previewFoto"></div>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem: * <span id="contadorMensagem">0/500</span></label>
          <textarea id="mensagem" name="mensagem" placeholder="Mínimo 50 caracteres, máximo 500" required minlength="50" maxlength="500" rows="5"></textarea>
          <span class="erro" id="erroMensagem"></span>
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" id="termos" name="termos" required />
            Aceito os termos de uso *
          </label>
          <span class="erro" id="erroTermos"></span>
        </div>

      </fieldset>

      <div class="botoes">
        <button type="submit" id="btnEnviar">Enviar</button>
        <button type="reset" id="btnLimpar">Limpar</button>
      </div>

    </form>
  </main>

  <footer>
    <p>Escola Técnica — Programação Web 1</p>
  </footer>
  <script src="js/util.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
